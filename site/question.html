<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>題目頁｜電子學題庫</title><style>:root{--ink:#18222f;--muted:#697586;--bg:#f2f5f7;--line:#dce2e7;--blue:#1664d8;--soft:#e9f1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}.top{height:66px;padding:0 max(22px,calc((100% - 1000px)/2));display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}a{color:var(--blue)}.brand{color:var(--ink);font-weight:800;text-decoration:none}main{max-width:1000px;margin:auto;padding:38px 22px 60px}.back{display:inline-block;margin-bottom:24px;font-weight:800;text-decoration:none}.card{padding:28px;background:#fff;border:1px solid var(--line);border-radius:17px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tags span{padding:5px 8px;border-radius:7px;background:var(--soft);color:var(--blue);font-size:12px;font-weight:800}h1{margin:16px 0 8px;font-size:clamp(27px,5vw,42px)}.source{color:var(--muted)}.notice{margin-top:22px;padding:16px;border-left:4px solid var(--blue);border-radius:8px;background:var(--soft);line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.button{padding:11px 15px;border-radius:9px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}</style></head><body><header class="top"><a class="brand" href="index.html">E　電子學題庫</a><span>Smith 第八版</span></header><main><a class="back" id="back" href="index.html">← 返回章節</a><article class="card"><div class="tags"><span id="chapter"></span><span id="qid"></span></div><h1 id="topic">題目</h1><p class="source" id="source"></p><div class="notice">本題已建立獨立題目頁。原始題目請由下方開啟該年度試題 PDF；完成切圖與四級解答後，會直接顯示於此頁。</div><div class="actions"><a class="button" id="pdf" href="#">開啟原始題目 PDF</a><a class="button secondary" id="quiz" href="quiz.html" hidden>進入四級測驗</a></div></article></main><script>const p=new URLSearchParams(location.search),year=p.get('year'),number=p.get('number'),chapter=p.get('chapter'),topic=p.get('topic')||'題目',title=p.get('title')||'';document.title=`${year}-${number} ${topic}｜電子學題庫`;document.getElementById('chapter').textContent=`第 ${chapter} 章 ${title}`;document.getElementById('qid').textContent=`${year} 年第 ${number} 題`;document.getElementById('topic').textContent=topic;document.getElementById('source').textContent=`${year} 學年度四技二專統一入學測驗・專業科目（一）・第 ${number} 題`;document.getElementById('back').href=`chapters/chapter-${chapter}.html`;document.getElementById('pdf').href=`../111-115_exam_PDF/${year}_professional_1_question.pdf`;if(p.get('ready')==='1')document.getElementById('quiz').hidden=false;</script></body></html>
