<header class="top"><div class="brand"><span class="mark">E</span>電子學題庫</div><small>四級測驗設計範例</small></header>
<main><section class="intro"><div><h1>同一題，四種學習深度</h1><p>等級愈高，學生需要自行完成的計算步驟愈多。</p></div><div class="difficulty"><strong id="levelName">等級 1</strong><span id="levelNote">選擇正確答案</span></div></section>
<nav class="levelTabs" id="tabs" aria-label="難度等級"></nav>
<section class="layout"><article class="card question"><div class="meta"><span class="tag">111 年第 27 題</span><span class="tag">稽納二極體</span></div><div class="imageWrap"><img src="file:///C:/Users/Eli/.codex/visualizations/2026/08/13/019ffba4-80b5-7ed3-a9a4-ee902d86127c/q27.jpg" alt="第27題原始試題切圖"></div></article><aside class="card work"><h2 id="workTitle"></h2><p id="workHelp"></p><div id="levelGoal" class="levelGoal"></div><div id="answerArea"></div><div class="actions"><button class="primary" id="check">檢查答案</button><button class="ghost" id="reset">清除</button></div><div id="result"></div></aside></section><section class="card stats" aria-live="polite"><div class="statsHead"><div><h2>我的學習分析</h2><small>統計保存在此裝置，作答後自動更新</small></div><button class="ghost" id="clearStats">重設統計</button></div><div id="statsContent"></div></section></main>
<script>
const levels=[
{name:'等級 1',note:'觀念辨識',help:'從選項判斷答案，建立題型辨識與觀念連結。',goal:'訓練目標：看懂題意、辨認考點，能從選項選出正確答案。'},
{name:'等級 2',note:'關鍵計算＋單位',help:'完整呈現計算流程，只填關鍵數值與常用單位。',goal:'訓練目標：掌握關鍵公式，建立數值必須搭配正確單位的習慣。'},
{name:'等級 3',note:'中間推導＋量綱',help:'增加中間值、轉換與單位判斷，找出容易出錯的步驟。',goal:'訓練目標：能完成中間推導，辨認 V、A、Ω、S、dB 與倍率等量綱。'},
{name:'等級 4',note:'完整計算＋驗算',help:'自行完成最多步驟，數值、正負號、單位與驗算都必須正確。',goal:'訓練目標：獨立完成完整解題流程，並用單位與代回驗算檢查答案。'}];
let level=1;const $=id=>document.getElementById(id);
function input(id,ans,wide=false){return `<input class="blank ${wide?'wide':''}" id="${id}" data-answer="${ans}" autocomplete="off" inputmode="decimal">`}
function content(){if(level===1)return `<div class="choices">${[['A','\\(4.7\\,\\mathrm{k}\\Omega\\)'],['B','\\(3.5\\,\\mathrm{k}\\Omega\\)'],['C','\\(2.4\\,\\mathrm{k}\\Omega\\)'],['D','\\(1.2\\,\\mathrm{k}\\Omega\\)']].map(x=>`<button class="choice" data-value="${x[0]}"><span>${x[0]}</span><b>${x[1]}</b></button>`).join('')}</div>`;
if(level===2)return `<div class="steps"><div class="step"><b>① 已知與穩壓條件</b><br>\\(V_S=12\\,\\mathrm{V},\\ R_S=1\\,\\mathrm{k}\\Omega,\\ V_Z=6\\,\\mathrm{V},\\ I_{ZK}=1\\,\\mathrm{mA},\\ I_{ZM}=16\\,\\mathrm{mA}\\)<br>正常穩壓時：\\(V_O=V_Z=6\\,\\mathrm{V}\\)。</div><div class="step"><b>② 串聯電阻電壓</b><br>\\(V_{R_S}=V_S-V_Z=12-6=\\) ${input('a','6')} \\(\\mathrm{V}\\)。</div><div class="step"><b>③ 串聯總電流</b><br>\\(I_S=\\dfrac{V_{R_S}}{R_S}=\\dfrac{6\\,\\mathrm{V}}{1\\,\\mathrm{k}\\Omega}=\\) ${input('b','6')} \\(\\mathrm{mA}\\)，且 \\(I_S=I_Z+I_L\\)。</div><div class="step"><b>④ 最大負載電流</b><br>\\(R_L\\) 最小時 \\(I_L\\) 最大；穩壓須 \\(I_Z\\ge I_{ZK}\\)。臨界時 \\(I_Z=1\\,\\mathrm{mA}\\)，故 \\(I_{L(\\max)}=I_S-I_{ZK}=6-1=\\) ${input('c','5')} \\(\\mathrm{mA}\\)。</div><div class="step"><b>⑤ 最小負載電阻</b><br>\\(R_{L(\\min)}=\\dfrac{V_O}{I_{L(\\max)}}=\\dfrac{6\\,\\mathrm{V}}{5\\,\\mathrm{mA}}=\\) ${input('d','1.2')} \\(\\mathrm{k}\\Omega\\)，因此選 D。</div><div class="step"><b>⑥ 代回驗算</b><br>\\(I_L=\\dfrac{6\\,\\mathrm{V}}{1.2\\,\\mathrm{k}\\Omega}=5\\,\\mathrm{mA}\\)<br>\\(I_Z=I_S-I_L=6-5=1\\,\\mathrm{mA}\\)<br>\\(1\\,\\mathrm{mA}\\le I_Z\\le16\\,\\mathrm{mA}\\)，符合穩壓範圍。</div></div>`;
if(level===3)return `<div class="steps"><div class="step"><b>① 已知與穩壓條件</b><br>\\(V_S=\\) ${input('a','12')} \\(\\mathrm{V},\\ R_S=1\\,\\mathrm{k}\\Omega,\\ V_Z=6\\,\\mathrm{V},\\ I_{ZK}=\\) ${input('b','1')} \\(\\mathrm{mA},\\ I_{ZM}=16\\,\\mathrm{mA}\\)<br>\\(V_O=V_Z=6\\,\\mathrm{V}\\)。</div><div class="step"><b>② 串聯電阻電壓</b><br>\\(V_{R_S}=V_S-V_Z=12-6=\\) ${input('c','6')} \\(\\mathrm{V}\\)。</div><div class="step"><b>③ 串聯總電流</b><br>\\(I_S=\\dfrac{V_{R_S}}{R_S}=\\dfrac{\\) ${input('d','6')} \\(\\mathrm{V}}{1\\,\\mathrm{k}\\Omega}=\\) ${input('e','6')} \\(\\mathrm{mA}\\)，且 \\(I_S=I_Z+I_L\\)。</div><div class="step"><b>④ 最大負載電流</b><br>臨界穩壓時 \\(I_Z=I_{ZK}=1\\,\\mathrm{mA}\\)；\\(I_{L(\\max)}=I_S-I_{ZK}=6-1=\\) ${input('f','5')} \\(\\mathrm{mA}\\)。</div><div class="step"><b>⑤ 最小負載電阻</b><br>\\(R_{L(\\min)}=\\dfrac{V_O}{I_{L(\\max)}}=\\dfrac{6\\,\\mathrm{V}}{5\\,\\mathrm{mA}}=\\) ${input('g','1.2')} \\(\\mathrm{k}\\Omega\\)。</div><div class="step"><b>⑥ 代回驗算</b><br>\\(I_L=5\\,\\mathrm{mA}\\)，\\(I_Z=I_S-I_L=6-5=\\) ${input('h','1')} \\(\\mathrm{mA}\\)<br>\\(1\\,\\mathrm{mA}\\le I_Z\\le16\\,\\mathrm{mA}\\)，條件成立。</div></div>`;
return `<div class="steps"><div class="step"><b>① 已知與穩壓條件</b><br>\\(V_S=\\) ${input('a','12')} \\(\\mathrm{V},\\ R_S=\\) ${input('b','1')} \\(\\mathrm{k}\\Omega,\\ V_Z=\\) ${input('c','6')} \\(\\mathrm{V},\\ I_{ZK}=\\) ${input('d','1')} \\(\\mathrm{mA},\\ I_{ZM}=16\\,\\mathrm{mA}\\)<br>\\(V_O=V_Z=\\) ${input('e','6')} \\(\\mathrm{V}\\)。</div><div class="step"><b>② 串聯電阻電壓</b><br>\\(V_{R_S}=V_S-V_Z=\\) ${input('f','12')} \\(-\\) ${input('g','6')} \\(=\\) ${input('h','6')} \\(\\mathrm{V}\\)。</div><div class="step"><b>③ 串聯總電流</b><br>\\(I_S=\\dfrac{V_{R_S}}{R_S}=\\dfrac{6\\,\\mathrm{V}}{1\\,\\mathrm{k}\\Omega}=\\) ${input('i','6')} \\(\\mathrm{mA}\\)，且 \\(I_S=I_Z+I_L\\)。</div><div class="step"><b>④ 最大負載電流</b><br>\\(R_L\\) 最小時 \\(I_L\\) 最大；穩壓須 \\(I_Z\\ge I_{ZK}\\)。臨界時 \\(I_Z=\\) ${input('j','1')} \\(\\mathrm{mA}\\)，所以 \\(I_{L(\\max)}=I_S-I_{ZK}=\\) ${input('k','6')} \\(-1=\\) ${input('l','5')} \\(\\mathrm{mA}\\)。</div><div class="step"><b>⑤ 最小負載電阻</b><br>\\(R_{L(\\min)}=\\dfrac{V_O}{I_{L(\\max)}}=\\dfrac{6\\,\\mathrm{V}}{5\\,\\mathrm{mA}}=\\) ${input('m','1.2')} \\(\\mathrm{k}\\Omega\\)，因此選 D。</div><div class="step"><b>⑥ 代回驗算</b><br>\\(I_L=\\dfrac{6\\,\\mathrm{V}}{1.2\\,\\mathrm{k}\\Omega}=5\\,\\mathrm{mA}\\)<br>\\(I_Z=I_S-I_L=6-5=\\) ${input('n','1')} \\(\\mathrm{mA}\\)<br>\\(1\\,\\mathrm{mA}\\le I_Z\\le16\\,\\mathrm{mA}\\)，條件成立，答案確認正確。</div></div>`}
function render(){const d=levels[level-1];$('levelName').textContent=d.name;$('levelNote').textContent=d.note;$('workTitle').textContent=`${d.name}・${d.note}`;$('workHelp').textContent=d.help;$('tabs').innerHTML=levels.map((x,i)=>`<button class="level ${level===i+1?'active':''}" data-level="${i+1}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join('');$('answerArea').innerHTML=content();$('result').innerHTML='';document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);const p=new URLSearchParams(location.search),chapter3Id=p.get('id');if(['112-27','114-26','115-1'].includes(chapter3Id)){p.set('level',String(level));location.search=p.toString();return}render()});document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([$('answerArea')]);MathJax.typesetPromise([$('answerArea')])}}
$('check').onclick=()=>{if(level===1){const s=document.querySelector('.choice.selected');if(!s){show(false,'請先選擇一個答案。');return}show(s.dataset.value==='D',s.dataset.value==='D'?'答對了！RL 最小值為 1.2 kΩ。':'答案不正確。提示：稽納二極體至少要保留 1mA。');return}const fields=[...document.querySelectorAll('.blank')];let correct=0;fields.forEach(f=>{const ok=f.value.trim().replace(/,/g,'')===f.dataset.answer;f.classList.toggle('good',ok);f.classList.toggle('bad',!ok);if(ok)correct++});show(correct===fields.length,`答對 ${correct} / ${fields.length} 格。${correct===fields.length?'完整計算正確！':'紅色格請再檢查。'}`)};
$('reset').onclick=()=>{render()};function show(ok,text){$('result').className=`result ${ok?'ok':'error'}`;$('result').textContent=text}render();window.addEventListener('load',()=>window.MathJax?.typesetPromise?.([$('answerArea')]));
</script><script src="data/other-questions.js"></script><script src="data/chapter4-remaining.js"></script><script src="data/chapter6-questions.js"></script><script src="data/chapter5-more.js"></script><script src="data/chapter5-113.js"></script><script src="data/chapter5-114.js"></script><script src="data/chapter5-115.js"></script><script src="data/chapter5-questions.js"></script><script src="data/chapter7-questions.js"></script><script src="data/chapter3-questions.js?v=6"></script><script src="data/chapter2-questions.js?v=2"></script></body></html>
